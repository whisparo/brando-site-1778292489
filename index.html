<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملابس</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Cairo, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: #333;
            background-color: #f7f7f7;
            overflow-x: hidden;
        }
        .glass {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 10px;
        }
        .glass::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            z-index: -1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="bg-transparent glass sticky top-0 z-10 py-4 px-6 flex flex-row justify-between items-center">
        <img src="logo.png" alt="ملابس" class="h-10 w-10 rounded-full">
        <ul class="flex flex-row items-center">
            <li class="mr-6"><a href="#" class="text-white hover:text-gray-300">الرئيسية</a></li>
            <li class="mr-6"><a href="#" class="text-white hover:text-gray-300">خدماتنا</a></li>
            <li class="mr-6"><a href="#" class="text-white hover:text-gray-300">اتصل بنا</a></li>
        </ul>
    </nav>
    <header class="flex flex-col items-center justify-center min-h-screen bg-fixed bg-cover bg-center" style="background-image: url('https://source.unsplash.com/featured/?ملابس')">
        <h1 class="text-5xl font-bold text-white mb-2">ملابس</h1>
        <h2 class="text-2xl text-gray-400 mb-4">زي لطيف للرجال والنساء</h2>
        <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">ابدأ الآن</button>
    </header>
    <section class="container mx-auto p-6">
        <h2 class="text-3xl font-bold mb-2">خدماتنا</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="glass p-6 rounded shadow-md hover:scale-105 transition duration-300">
                <h3 class="text-lg font-bold mb-2">خدمة 1</h3>
                <p class="text-gray-600">تواصل معنا للحصول على خدماتنا</p>
            </div>
            <div class="glass p-6 rounded shadow-md hover:scale-105 transition duration-300">
                <h3 class="text-lg font-bold mb-2">خدمة 2</h3>
                <p class="text-gray-600">تواصل معنا للحصول على خدماتنا</p>
            </div>
            <div class="glass p-6 rounded shadow-md hover:scale-105 transition duration-300">
                <h3 class="text-lg font-bold mb-2">خدمة 3</h3>
                <p class="text-gray-600">تواصل معنا للحصول على خدماتنا</p>
            </div>
        </div>
    </section>
    <button class="fixed bottom-2 right-2 bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="21" y1="10" x2="3" y2="10" />
            <line x1="21" y1="18" x2="3" y2="18" />
        </svg>
        <span class="ml-2">تواصل معنا</span>
    </button>
    <section class="container mx-auto p-6">
        <h2 class="text-3xl font-bold mb-2">اتصل بنا</h2>
        <form class="bg-white glass p-6 rounded shadow-md">
            <div class="mb-4">
                <label class="block text-lg font-bold mb-2">الإسم</label>
                <input type="text" class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500" placeholder="إسمك">
            </div>
            <div class="mb-4">
                <label class="block text-lg font-bold mb-2">البريد الإلكتروني</label>
                <input type="email" class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500" placeholder="الإيميل">
            </div>
            <div class="mb-4">
                <label class="block text-lg font-bold mb-2">الرسالة</label>
                <textarea rows="4" class="w-full px-4 py-2 rounded border border-gray-300 focus:outline-none focus:border-blue-500" placeholder="الرسالة"></textarea>
            </div>
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">إرسال رسالة</button>
        </form>
    </section>
    <footer class="container mx-auto p-6 bg-gray-100 text-center text-gray-600">
        <p>&copy; 2023 ملاحظاتك. صُنع بذكاء بواسطة براندو.</p>
    </footer>
</body>
</html>
